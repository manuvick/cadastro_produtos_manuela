<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<title>Login - Snoopy Store</title>
</head>
<body>
<div class="recipiente">
  <h1>Login</h1>
  <input id="email" placeholder="Email" value="admin@teste.com">
  <input id="senha" type="password" placeholder="Senha" value="123456">
  <button onclick="login()">Entrar</button>
  <p><a href="cadastro.html">Criar conta admin</a> | <a href="index.html">Ver produtos</a></p>
  <p id="msg"></p>
</div>
<script>
const API = "http://localhost:3000";
async function login(){
  const res = await fetch(`${API}/auth/login`,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({email: document.getElementById('email').value, senha: document.getElementById('senha').value})
  });
  const data = await res.json();
  if(data.token){
    localStorage.setItem('token', data.token);
    localStorage.setItem('perfil', data.perfil);
    localStorage.setItem('nome', data.nome);
    document.getElementById('msg').innerText = "Logado como "+data.perfil+"! Indo pro cadastro...";
    setTimeout(()=> location.href='index.html', 1000);
  } else {
    document.getElementById('msg').innerText = data.erro;
  }
}
</script>
</body>
</html>
